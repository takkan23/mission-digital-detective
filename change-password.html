<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    ตั้งรหัสผ่านใหม่ | Mission Digital Detective
  </title>

  <link
    href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      font-family: "Kanit", sans-serif;
      color: #f1f8fb;

      background:
        radial-gradient(
          circle at 15% 20%,
          rgba(0, 216, 255, .12),
          transparent 35%
        ),
        radial-gradient(
          circle at 85% 80%,
          rgba(255, 45, 145, .08),
          transparent 35%
        ),
        #020914;
    }

    .security-card {
      width: min(560px, 100%);

      padding: 38px;

      border: 1px solid rgba(0, 216, 255, .35);
      border-radius: 14px;

      background: rgba(3, 16, 29, .96);

      box-shadow:
        0 0 50px rgba(0, 216, 255, .07);
    }

    .security-label {
      margin-bottom: 8px;

      color: #00d8ff;

      font-size: 12px;
      font-weight: 600;

      letter-spacing: .16em;
    }

    h1 {
      margin: 0;

      font-size: clamp(28px, 5vw, 40px);
      line-height: 1.2;
    }

    .description {
      margin: 12px 0 26px;

      color: #8298a4;
      line-height: 1.7;
    }

    .student-box {
      margin-bottom: 26px;
      padding: 16px 18px;

      border-left: 3px solid #00d8ff;

      background: rgba(0, 216, 255, .06);
    }

    .student-name {
      color: #ffffff;
      font-weight: 600;
    }

    .student-detail {
      margin-top: 4px;

      color: #78909b;
      font-size: 13px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;

      margin-bottom: 7px;

      color: #b6c7cf;
      font-size: 13px;
    }

    .password-wrap {
      display: flex;

      border: 1px solid rgba(255, 255, 255, .15);
      border-radius: 8px;

      overflow: hidden;

      background: #010a13;
    }

    .password-wrap:focus-within {
      border-color: #00d8ff;
    }

    input {
      flex: 1;

      min-width: 0;
      height: 54px;

      padding: 0 15px;

      border: 0;
      outline: 0;

      color: #ffffff;
      background: transparent;

      font-family: inherit;
      font-size: 15px;
    }

    .toggle-password {
      width: 76px;

      border: 0;
      border-left: 1px solid rgba(255, 255, 255, .1);

      color: #00d8ff;
      background: transparent;

      font-family: inherit;
      cursor: pointer;
    }

    .rules {
      margin: 4px 0 24px;
      padding: 14px 16px;

      border: 1px solid rgba(255, 210, 0, .18);

      color: #8298a4;
      background: rgba(255, 210, 0, .03);

      font-size: 12px;
      line-height: 1.8;
    }

    .save-button {
      width: 100%;
      min-height: 55px;

      border: 0;
      border-radius: 8px;

      color: #001018;

      background:
        linear-gradient(
          90deg,
          #00d8ff,
          #2cff8c
        );

      font-family: inherit;
      font-weight: 700;
      font-size: 15px;

      cursor: pointer;
    }

    .save-button:hover {
      filter: brightness(1.08);
    }

    .save-button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .message {
      min-height: 26px;

      margin-top: 14px;

      text-align: center;

      color: #ff759e;

      font-size: 13px;
    }

    .success {
      color: #2cff8c;
    }

  </style>
</head>


<body>

  <main class="security-card">

    <div class="security-label">
      SECURITY SETUP
    </div>

    <h1>
      สร้างรหัสผ่านของคุณ
    </h1>

    <p class="description">
      ก่อนเข้าสู่ Mission Digital Detective
      กรุณาสร้างรหัสผ่านใหม่สำหรับบัญชีของคุณ
    </p>


    <section class="student-box">

      <div
        id="studentNameDisplay"
        class="student-name"
      >
        กำลังตรวจสอบข้อมูล...
      </div>

      <div
        id="studentDetailDisplay"
        class="student-detail"
      ></div>

    </section>


    <div class="field">

      <label for="newPassword">
        รหัสผ่านใหม่
      </label>

      <div class="password-wrap">

        <input
          type="password"
          id="newPassword"
          placeholder="สร้างรหัสผ่านใหม่"
          autocomplete="new-password"
        >

        <button
          type="button"
          class="toggle-password"
          data-target="newPassword"
        >
          แสดง
        </button>

      </div>

    </div>


    <div class="field">

      <label for="confirmPassword">
        ยืนยันรหัสผ่านใหม่
      </label>

      <div class="password-wrap">

        <input
          type="password"
          id="confirmPassword"
          placeholder="กรอกรหัสผ่านใหม่อีกครั้ง"
          autocomplete="new-password"
        >

        <button
          type="button"
          class="toggle-password"
          data-target="confirmPassword"
        >
          แสดง
        </button>

      </div>

    </div>


    <div class="rules">
      รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร<br>
      ห้ามใช้ 123456 เป็นรหัสผ่านใหม่<br>
      กรุณาจดจำรหัสผ่านของตนเองและไม่บอกรหัสผ่านแก่ผู้อื่น
    </div>


    <button
      type="button"
      id="savePasswordButton"
      class="save-button"
    >
      CREATE PASSWORD →
    </button>


    <div
      id="passwordMessage"
      class="message"
    ></div>

  </main>


  <!-- Supabase Library -->
  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <!-- ใช้ไฟล์ config เดียวกับหน้า login -->
  <script src="js/supabase-config.js"></script>


  <script>

    document.addEventListener(
      "DOMContentLoaded",
      function () {


        /* ===============================================
           SESSION
        =============================================== */

        const studentId =
          sessionStorage.getItem(
            "pendingStudentId"
          );
        const studentNumber =
            sessionStorage.getItem(
                "pendingStudentNumber"
            );

        const studentName =
          sessionStorage.getItem(
            "pendingStudentName"
          );

        const className =
          sessionStorage.getItem(
            "pendingClassName"
          );

        const currentPassword =
          sessionStorage.getItem(
            "pendingCurrentPassword"
          );
          const pendingSessionToken =
            sessionStorage.getItem(
                "pendingSessionToken"
            );


        /*
          ถ้าเปิดหน้านี้โดยไม่ได้ผ่าน Login
          ให้กลับหน้า Login
        */

        if (
          !studentId ||
          !currentPassword
        ) {

          window.location.href =
            "index.html";

          return;
        }


        /* ===============================================
           DISPLAY STUDENT
        =============================================== */

        document.getElementById(
          "studentNameDisplay"
        ).textContent =
          studentName || "นักเรียน";


        document.getElementById(
          "studentDetailDisplay"
        ).textContent =
          "ID: "
          + studentId
          + "   |   CLASS: "
          + (className || "-");


        /* ===============================================
           ELEMENTS
        =============================================== */

        const newPasswordInput =
          document.getElementById(
            "newPassword"
          );

        const confirmPasswordInput =
          document.getElementById(
            "confirmPassword"
          );

        const saveButton =
          document.getElementById(
            "savePasswordButton"
          );

        const message =
          document.getElementById(
            "passwordMessage"
          );


        function showMessage(
          text,
          success = false
        ) {

          message.textContent =
            text;

          message.classList.toggle(
            "success",
            success
          );

        }


        /* ===============================================
           SHOW / HIDE PASSWORD
        =============================================== */

        document
          .querySelectorAll(
            ".toggle-password"
          )
          .forEach(
            function (button) {

              button.addEventListener(
                "click",
                function () {

                  const target =
                    document.getElementById(
                      button.dataset.target
                    );

                  if (
                    target.type ===
                    "password"
                  ) {

                    target.type =
                      "text";

                    button.textContent =
                      "ซ่อน";

                  }

                  else {

                    target.type =
                      "password";

                    button.textContent =
                      "แสดง";

                  }

                }
              );

            }
          );


        /* ===============================================
           CHANGE PASSWORD
        =============================================== */

        async function savePassword() {


          showMessage("");


          const newPassword =
            newPasswordInput
              .value
              .trim();


          const confirmPassword =
            confirmPasswordInput
              .value
              .trim();


          if (
            newPassword.length < 6
          ) {

            showMessage(
              "รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร"
            );

            newPasswordInput.focus();

            return;
          }


          if (
            newPassword === "123456"
          ) {

            showMessage(
              "ไม่สามารถใช้ 123456 เป็นรหัสผ่านใหม่ได้"
            );

            newPasswordInput.focus();

            return;
          }


          if (
            newPassword !==
            confirmPassword
          ) {

            showMessage(
              "รหัสผ่านทั้งสองช่องไม่ตรงกัน"
            );

            confirmPasswordInput.focus();

            return;
          }


          const oldButtonText =
            saveButton.textContent;


          saveButton.disabled =
            true;

          saveButton.textContent =
            "SAVING...";


          try {


            const {
              data,
              error
            } =
              await supabaseClient.rpc(
                "change_student_password",
                {

                  p_student_id:
                    studentId,

                  p_current_password:
                    currentPassword,

                  p_new_password:
                    newPassword

                }
              );


            if (error) {
              throw error;
            }


            if (
              data !== true
            ) {

              showMessage(
                "ไม่สามารถเปลี่ยนรหัสผ่านได้ กรุณาเข้าสู่ระบบใหม่"
              );

              return;
            }


/* ===========================================
   SUCCESS
=========================================== */

showMessage(
  "สร้างรหัสผ่านสำเร็จ กำลังเข้าสู่ Mission HQ...",
  true
);


/* ===========================================
   CLEAR TEACHER SESSION
=========================================== */

localStorage.removeItem(
  "teacherLoggedIn"
);

localStorage.removeItem(
  "teacherId"
);

localStorage.removeItem(
  "teacherName"
);

localStorage.removeItem(
  "teacherSessionToken"
);

localStorage.removeItem(
  "teacherSessionExpiresAt"
);


/* ===========================================
   CREATE STUDENT SESSION
=========================================== */

localStorage.setItem(
  "userRole",
  "student"
);


localStorage.setItem(
  "studentLoggedIn",
  "true"
);


localStorage.setItem(
  "studentId",
  studentId
);


localStorage.setItem(
  "studentNumber",
  studentNumber || ""
);


localStorage.setItem(
  "studentName",
  studentName || ""
);


localStorage.setItem(
  "className",
  className || ""
);


/* ===========================================
   สำคัญมาก
   เก็บ Student Session Token
=========================================== */

if (
  pendingSessionToken
) {

  localStorage.setItem(
    "studentSessionToken",
    pendingSessionToken
  );

}


/* ===========================================
   PASSWORD STATUS
=========================================== */

localStorage.setItem(
  "mustChangePassword",
  "false"
);


localStorage.setItem(
  "loginTime",
  new Date().toISOString()
);


/* ===========================================
   CLEAR TEMPORARY SESSION
=========================================== */

sessionStorage.removeItem(
  "pendingStudentId"
);

sessionStorage.removeItem(
  "pendingStudentNumber"
);

sessionStorage.removeItem(
  "pendingStudentName"
);

sessionStorage.removeItem(
  "pendingClassName"
);

sessionStorage.removeItem(
  "pendingCurrentPassword"
);

sessionStorage.removeItem(
  "pendingSessionToken"
);


/* ===========================================
   GO TO DASHBOARD
=========================================== */

setTimeout(
  function () {

    window.location.href =
      "dashboard.html";

  },
  900
); 


            console.error(
              "Change password error:",
              error
            );


            showMessage(
              "เกิดข้อผิดพลาดในการบันทึกรหัสผ่าน กรุณาลองใหม่"
            );


          }

          finally {


            saveButton.disabled =
              false;


            saveButton.textContent =
              oldButtonText;


          }

        }


        saveButton.addEventListener(
          "click",
          savePassword
        );


        confirmPasswordInput.addEventListener(
          "keydown",
          function (event) {

            if (
              event.key === "Enter"
            ) {

              savePassword();

            }

          }
        );


      }
    );

  </script>

</body>
</html>
