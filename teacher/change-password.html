<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Change Password | Teacher Control
  </title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="../css/teacher.css"
  >

</head>


<body class="teacher-page">


  <header class="teacher-topbar">

    <div class="teacher-brand">

      <div class="teacher-brand-icon">
        🔐
      </div>

      <div>

        <div class="teacher-brand-small">
          MISSION DIGITAL DETECTIVE
        </div>

        <div class="teacher-brand-title">
          TEACHER SECURITY
        </div>

      </div>

    </div>


    <a
      href="dashboard.html"
      class="teacher-back-button"
    >
      ← DASHBOARD
    </a>

  </header>


  <section class="teacher-password-page">

    <div class="teacher-password-card">

      <div class="teacher-section-label">
        SECURITY SETTINGS
      </div>

      <h1>
        เปลี่ยนรหัสผ่านครู
      </h1>

      <p>
        กรอกรหัสผ่านปัจจุบัน
        และกำหนดรหัสผ่านใหม่สำหรับเข้า Teacher Control
      </p>


      <form id="teacherChangePasswordForm">


        <label>
          รหัสผ่านปัจจุบัน
        </label>

        <input
          id="currentTeacherPassword"
          type="password"
          autocomplete="current-password"
          required
        >


        <label>
          รหัสผ่านใหม่
        </label>

        <input
          id="newTeacherPassword"
          type="password"
          minlength="6"
          autocomplete="new-password"
          required
        >


        <label>
          ยืนยันรหัสผ่านใหม่
        </label>

        <input
          id="confirmTeacherPassword"
          type="password"
          minlength="6"
          autocomplete="new-password"
          required
        >


        <div
          id="teacherPasswordMessage"
          class="teacher-password-message"
        ></div>


        <button
          type="submit"
          id="changeTeacherPasswordButton"
          class="teacher-save-button"
        >
          CHANGE PASSWORD →
        </button>


      </form>

    </div>

  </section>


  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script src="../js/supabase-config.js"></script>

  <script src="../js/teacher-auth.js"></script>

  <script src="../js/teacher-change-password.js"></script>


</body>

</html>
